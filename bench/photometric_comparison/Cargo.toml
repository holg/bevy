[package]
name = "photometric-comparison"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
bevy = { path = "../..", default-features = true, features = [
    "pbr_photometric_lights",
    "pbr_clustered_decals",
    "pbr_light_textures",
] }

# GLDF/L3D support (native only — tokio doesn't build for wasm)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gldf-rs = { path = "../../../gldf-rs/crates/gldf-rs-lib" }
gldf-bevy = { path = "../../../gldf-rs/crates/gldf-bevy" }

# Optimize for WASM release
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
